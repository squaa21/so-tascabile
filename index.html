<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECF0F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1218" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SO Tascabile">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317202A'/%3E%3Ctext x='32' y='42' font-family='monospace' font-size='26' font-weight='700' fill='%23FF6A13' text-anchor='middle'%3ESO%3C/text%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>SO Tascabile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: una colonna da telefono; home = percorso a zig-zag dei moduli, lezione = schermo pieno con barra azioni in basso */
:root{
  --bg:#ECF0F5; --surface:#FFFFFF; --surface-2:#F4F6F9; --ink:#17202A; --muted:#5A6777; --line:#D2DAE4;
  --accent:#FF6A13; --accent-deep:#C94F06; --accent-soft:#FFE6D6; --on-accent:#FFFFFF;
  --ok:#1E9A53; --ok-deep:#14753E; --ok-soft:#DCF4E6;
  --bad:#DE3B42; --bad-deep:#A82A30; --bad-soft:#FCE3E3;
  --gold:#E9A800; --code-bg:#18212C; --code-ink:#E4EBF2; --code-dim:#7F90A3;
  --f-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1218; --surface:#161D26; --surface-2:#1C2530; --ink:#E6ECF2; --muted:#93A1B2; --line:#2A3441;
  --accent:#FF7A2B; --accent-deep:#B9500F; --accent-soft:#3A2416; --on-accent:#FFFFFF;
  --ok:#33C072; --ok-deep:#1D8A4C; --ok-soft:#14321F;
  --bad:#FF6268; --bad-deep:#A8323A; --bad-soft:#3A1B1E;
  --gold:#F5BD1F; --code-bg:#0A0F15; --code-ink:#E4EBF2; --code-dim:#71839A; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1218; --surface:#161D26; --surface-2:#1C2530; --ink:#E6ECF2; --muted:#93A1B2; --line:#2A3441;
  --accent:#FF7A2B; --accent-deep:#B9500F; --accent-soft:#3A2416; --on-accent:#FFFFFF;
  --ok:#33C072; --ok-deep:#1D8A4C; --ok-soft:#14321F;
  --bad:#FF6268; --bad-deep:#A8323A; --bad-soft:#3A1B1E;
  --gold:#F5BD1F; --code-bg:#0A0F15; --code-ink:#E4EBF2; --code-dim:#71839A; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
b,strong{font-weight:800}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{min-height:100%}
.screen[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.01em;text-wrap:balance;margin:0}
.muted{color:var(--muted)}
.label{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:12px 18px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 4px 0 var(--accent-deep);transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--accent-deep)}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:0 4px 0 var(--line);cursor:default}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 var(--ok-deep)}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 var(--bad-deep)}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost:active{box-shadow:0 0 0 var(--line)}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--muted)}
.iconbtn:active{background:var(--surface-2)}
svg.i{width:22px;height:22px;flex:none}

/* HOME */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 8px}
.top .row{display:flex;align-items:center;gap:8px}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600;flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.flame{color:var(--accent)}
.pill.flame.off{color:var(--muted)}
.pill .i{width:18px;height:18px}
.examline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
.examline b{color:var(--ink)}
.goalbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;flex:1;max-width:160px}
.goalbar>i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s}

.hero{margin-top:14px;background:var(--ink);color:var(--bg);border-radius:22px;padding:18px 18px 20px;position:relative;overflow:hidden}
.hero h2{font-size:26px;line-height:1.1;color:var(--bg)}
.hero p{margin:6px 0 16px;opacity:.75;font-size:14px}
.hero .term{font-family:var(--f-mono);font-size:12px;opacity:.6;margin-bottom:8px}
.hero .btn{max-width:260px}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;border:18px solid var(--accent);opacity:.9}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:var(--r);background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);text-align:left;min-width:0}
.mode:active{transform:translateY(3px);box-shadow:none}
.mode .t{font-weight:800;font-size:15px;line-height:1.2}
.mode .d{font-size:12.5px;color:var(--muted);line-height:1.3}
.mode .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.mode .ic svg{width:20px;height:20px}
.mode:disabled{opacity:.55}
.ic.c1{background:var(--bad-soft);color:var(--bad)}
.ic.c2{background:var(--accent-soft);color:var(--accent)}
.ic.c3{background:var(--ok-soft);color:var(--ok)}
.ic.c4{background:var(--surface-2);color:var(--ink)}

.pathhead{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 6px}
.pathhead h3{font-size:20px}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:12px 0 40px}
.unit{display:flex;flex-direction:column;align-items:center;gap:6px;width:150px}
.node{position:relative;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ring) calc(var(--p)*1%),var(--line) 0)}
.node .core{width:68px;height:68px;border-radius:50%;background:var(--surface);display:grid;place-items:center;box-shadow:0 5px 0 var(--line);font-family:var(--f-display);font-weight:800;font-size:24px;transition:transform .06s}
.unit:active .core{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.node.done .core{background:var(--gold);color:#3A2A00;box-shadow:0 5px 0 #B98500}
.node.started .core{background:var(--accent);color:var(--on-accent);box-shadow:0 5px 0 var(--accent-deep)}
.unit .nm{font-weight:800;font-size:14px;text-align:center;line-height:1.2}
.unit .tag{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:99px}
.unit .pc{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* SHEET */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:60;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:88%;overflow:auto}
.sheet.on{transform:none}
.sheet .wrap{padding-block:10px calc(20px + env(safe-area-inset-bottom,0px))}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:24px}
.sheet .sub{color:var(--muted);margin:4px 0 14px;font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.meter{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--gold);border-radius:99px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 18px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.seg{display:flex;gap:6px}
.seg button{padding:8px 12px;border-radius:10px;border:2px solid var(--line);font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* LESSON */
#lesson{display:flex;flex-direction:column;height:100%;overflow:hidden}
#lesson>.wrap{width:100%}
.hero>*{position:relative;z-index:1}
.lhead{display:flex;align-items:center;gap:10px;padding-block:10px}
.prog{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .35s cubic-bezier(.2,.8,.2,1);position:relative}
.prog>i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:9px;background:rgba(255,255,255,.35)}
.combo{font-weight:800;color:var(--accent);font-size:14px;min-width:42px;text-align:right;font-variant-numeric:tabular-nums}
.lbody{flex:1;overflow-y:auto;padding-block:8px 24px;-webkit-overflow-scrolling:touch}
.kind{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.kind .modtag{font-size:12px;font-weight:700;color:var(--muted);margin-left:auto;text-align:right}
.q{font-size:20px;font-weight:700;line-height:1.35;margin:0 0 16px;text-wrap:pretty}
.q.small{font-size:17px}
pre.code{background:var(--code-bg);color:var(--code-ink);font-family:var(--f-mono);font-size:12.5px;line-height:1.75;padding:14px;border-radius:14px;overflow-x:auto;margin:0 0 16px;white-space:pre-wrap;overflow-wrap:anywhere;tab-size:4}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);text-align:left;font-weight:600;font-size:16px;line-height:1.3}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.opt[aria-pressed="true"] .k{border-color:var(--accent);color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 3px 0 var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad)}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tfrow .opt{justify-content:center;font-size:18px;font-weight:800;padding:22px 10px}
.fillq{font-size:19px;line-height:2.1;font-weight:600;margin:0 0 18px}
.slot{display:inline-block;min-width:3ch;padding:0 8px;margin:0 2px;border-radius:8px;border-bottom:3px solid var(--muted);background:var(--surface-2);font-weight:700;line-height:1.6;vertical-align:baseline;color:var(--ink);font-size:inherit}
.slot.filled{background:var(--accent-soft);border-bottom-color:var(--accent)}
.slot.right{background:var(--ok-soft);border-bottom-color:var(--ok)}
.slot.wrong{background:var(--bad-soft);border-bottom-color:var(--bad);text-decoration:line-through}
pre.code .slot{font-family:var(--f-mono);font-size:12.5px;line-height:1.5;background:#2A3645;color:#FFFFFF;border-bottom-color:var(--code-dim);padding:0 6px}
pre.code .slot.filled{background:#5A3410;border-bottom-color:var(--accent)}
pre.code .slot.right{background:#174A2D;border-bottom-color:var(--ok)}
pre.code .slot.wrong{background:#5A1E22;border-bottom-color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding-top:6px}
.chip{padding:10px 14px;border-radius:12px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:700;font-size:15px}
.chip.mono{font-family:var(--f-mono);font-size:13.5px;font-weight:600}
.chip.used{background:var(--line);border-color:var(--line);box-shadow:none;color:transparent;pointer-events:none}
.chip:active{transform:translateY(3px);box-shadow:none}
.ordans{display:flex;flex-direction:column;gap:8px;min-height:64px;padding:10px;border:2px dashed var(--line);border-radius:14px;margin-bottom:14px}
.ordans:empty::before{content:"Tocca i passi qui sotto nell'ordine giusto";color:var(--muted);font-size:14px;padding:8px}
.ordit{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:12px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:600;font-size:15px;line-height:1.3;width:100%}
.ordit .n{flex:none;width:22px;height:22px;border-radius:7px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:800;display:grid;place-items:center}
.ordpool{display:flex;flex-direction:column;gap:8px}
.ordpool .ordit.used{display:none}
.ordit.right{border-color:var(--ok)}
.ordit.wrong{border-color:var(--bad)}
.numin{display:flex;gap:10px;align-items:center}
.numin input{flex:1;min-width:0;font:inherit;font-family:var(--f-display);font-size:30px;font-weight:800;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.numin input:focus{border-color:var(--accent);outline:none}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 4px 0 var(--line)}
.card .front{font-size:20px;font-weight:700;line-height:1.35}
.card .back{margin-top:16px;padding-top:16px;border-top:2px dashed var(--line);font-size:16px;line-height:1.5}
.lfoot{position:relative;border-top:2px solid var(--line);background:var(--bg)}
.lfoot .wrap{padding-block:14px calc(14px + env(safe-area-inset-bottom,0px))}
.lfoot .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fb{position:absolute;left:0;right:0;bottom:0;transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1);z-index:5}
.fb.on{transform:none}
.fb.good{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.fb .wrap{padding-block:16px calc(14px + env(safe-area-inset-bottom,0px))}
.fb h3{display:flex;align-items:center;gap:8px;font-size:21px}
.fb.good h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb .sol{margin:8px 0 4px;font-weight:700;color:var(--ink);font-size:15px;white-space:pre-wrap;word-break:break-word}
.fb .sol.mono{font-family:var(--f-mono);font-size:13px;font-weight:600}
.fb .why{margin:4px 0 14px;font-size:14.5px;color:var(--ink);opacity:.85;max-height:28vh;overflow:auto}

/* FLASHCARDS */
.deck{perspective:1200px;margin-top:8px}
.fcard{position:relative;min-height:340px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:24px;display:flex;flex-direction:column;border:2px solid var(--line);box-shadow:0 5px 0 var(--line);background:var(--surface);overflow:auto}
.face.b{transform:rotateY(180deg);background:var(--surface)}
.face .ft{font-family:var(--f-display);font-size:25px;font-weight:800;line-height:1.2;margin:auto 0;text-wrap:balance}
.face .bt{font-size:17px;line-height:1.55;margin:auto 0}
.face .hint{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
.face .mt{font-size:12px;font-weight:700;color:var(--muted)}

/* RESULT */
.res{text-align:center;padding-block:28px 20px}
.res .big{font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1.1;margin:14px 0 6px}
.res .burst{width:120px;height:120px;margin:0 auto;border-radius:50%;background:var(--gold);display:grid;place-items:center;color:#3A2A00;font-family:var(--f-display);font-size:40px;font-weight:800;box-shadow:0 6px 0 #B98500;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
.res .stats3{margin-top:22px}
.review{text-align:left;margin:18px 0}
.review li{margin:8px 0;font-size:14.5px}
.review ul{padding-left:18px;margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:90%}
.toast.on{opacity:1;transform:translate(-50%,0)}
.syncnote{font-size:12px;color:var(--muted);text-align:center;padding-bottom:28px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="home" class="screen">
  <div class="top"><div class="wrap">
    <div class="row">
      <div class="brand"><span class="mark">SO</span><span>Tascabile</span></div>
      <span class="pill flame" id="streakPill" title="Giorni di fila"><svg class="i" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3.2-.6 5-2 6.6C8.6 10.2 7 12 7 14.6A5 5 0 0 0 12 20a5 5 0 0 0 5-5.2c0-2-1-3.4-2-4.6.1 1.5-.5 2.6-1.6 3 .6-3.2-.3-7-1.4-11.2Z"/></svg><span id="streakN">0</span></span>
      <span class="pill" title="XP totali"><svg class="i" viewBox="0 0 24 24" fill="var(--gold)"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg><span id="xpN">0</span></span>

['mc', R`Su x86-64 il numero della system call va nel registro…`, [R`rax`, R`rdi`, R`rsp`, R`eax`], R`eax è l'equivalente a 32 bit. I parametri vanno in rdi, rsi, rdx, r10, r8, r9.`],
['mc', R`Quanti parametri al massimo passano nei registri in una system call?`, [R`6`, R`4`, R`8`, R`2`], R`Se ne servono di più, uno diventa un puntatore a una struttura.`],
['mc', R`Oggi su x86-64 l'istruzione trap è…`, [R`syscall`, R`int $0x80`, R`iret`, R`hlt`], R`int $0x80 (interrupt software 128) è il metodo vecchio a 32 bit.`],
['mc', R`I passi 1–2 della gestione di un interrupt (salvare il PC, caricare l'indirizzo della ISR) li fa…`, [R`l'hardware`, R`la ISR in C`, R`lo scheduler`, R`il driver`], R`Dal passo 3 in poi è software; i passi 3–4 sono uguali per tutti gli interrupt.`],

['mc', R`Il registro PSW contiene…`, [R`codici di condizione e modalità user/kernel`, R`l'indirizzo della prossima istruzione`, R`la cima dello stack`, R`il numero della system call`], R`La prossima istruzione è nel PC, la cima dello stack nello SP.`],

MODULES.push({ id: 'proc', title: 'Processi e thread', sub: 'PCB, stati, thread kernel/user', items: [

['mc', R`Una variabile static dentro una funzione sta…`, [R`nei dati statici`, R`nello stack`, R`nello heap`, R`in un registro`], R`static = dati statici anche se definita in un blocco; visibilità solo nel blocco.`],

MODULES.push({ id: 'fork', title: 'fork, wait, exec', sub: 'Esce sempre: fork, zombie, exec', practice: true, items: [

['fc', R`exec: cosa fa e cosa mantiene`, R`**Sostituisce il programma**: codice, dati, stack, heap nuovi. **Non crea un processo, il PID non cambia.** Mantiene la u-area (file aperti, directory corrente). **Se riesce non ritorna.**`],
['fc', R`Le lettere delle exec`, R`**l** = lista di argomenti finita da NULL · **v** = vettore · **p** = cerca nel PATH · **e** = passa l'ambiente. Tutte usano la system call **execve**.`],

['fc', R`Copy-on-write`, R`L'area text è condivisa; il resto è condiviso in **sola lettura** e il kernel ne copia una parte **solo quando uno dei due la modifica**.`],

['num', R`Quante X stampa?

['num', R`Quante X stampa?
for (int i = 0; i < 2; i++)

['num', R`Quante X stampa?

['code', R`Completa la exec di ls -l sulla cartella passata come argomento.`, R`printf("Sono il figlio %d\n", getpid());
[[fflush]](stdout);
execlp([["ls"]], "ls", [["-l"]], [[argv[1]]], NULL);
[[perror]]("exec fallita");
exit(1);`, [R`" -l"`, R`argv[0]`, R`printf`, R`fclose`], R`" -l" con lo spazio → ls lo prende come nome di file (errore che hai fatto).`],

if (pid == 0) {
    [[execvp]]([[argv[1]]], [[&argv[1]]]);

['fc', R`Starvation nello scheduling a priorità: soluzioni`, R`Abbassare la priorità di chi gira a ogni clock; **nice**; **priorità = 1/f** (f = frazione del quanto usata) che premia gli I/O-bound.`],

['fc', R`SPN e media esponenziale`, R`Stima il prossimo burst: **τₙ₊₁ = α·tₙ + (1−α)·τₙ**. α = 0 conta solo il passato, α = 1 solo l'ultimo burst, α = ½ è la media.`],

['mc', R`Round Robin con quanto troppo lungo diventa…`, [R`FCFS`, R`SJF`, R`a priorità`, R`SRTN`], R`Nessuno viene più interrotto.`],
['mc', R`Quale algoritmo NON può causare starvation?`, [R`Round Robin`, R`SRTN`, R`Priorità`, R`SPN`], R`Anche FCFS non ne causa. SRTN, SPN, priorità e feedback sì.`],
['mc', R`SJF dà l'attesa media minima quando…`, [R`i processi arrivano tutti insieme`, R`i processi arrivano in momenti diversi`, R`il quanto è breve`, R`ci sono più CPU`], R`Deve conoscere le durate in anticipo.`],
['mc', R`Gli obiettivi principali dei sistemi interattivi sono…`, [R`tempo di risposta e di attesa`, R`throughput e turnaround`, R`rispetto delle scadenze`, R`uso massimo della CPU`], R`Batch: throughput, turnaround, uso CPU. Real-time: scadenze e prevedibilità.`],
['mc', R`Lo scheduling preemptive richiede…`, [R`il timer interrupt`, R`il DMA`, R`la TLB`, R`i semafori`], R`Il timer ridà il controllo al kernel.`],
['mc', R`Con thread user-level, chi sceglie quale thread eseguire?`, [R`la libreria dei thread`, R`lo scheduler del kernel`, R`il thread stesso con il timer`, R`l'hardware`], R`Il kernel dà il quanto al processo, la libreria sceglie il thread.`],

['mc', R`Lo scheduler interviene quando un processo è creato o arriva un interrupt: questi due casi servono…`, [R`allo scheduling preemptive`, R`solo al non preemptive`, R`solo al FCFS`, R`a nessuno`], R`Terminazione e blocco bastano al non preemptive.`],
['tf', R`SJF è preemptive.`, false, R`La versione preemptive è SRTN.`],
['tf', R`Linux, Windows e macOS sono preemptive.`, true, R`Tutti i SO moderni.`],
['tf', R`Priorità = 1/f premia i processi I/O-bound.`, true, R`Usano poco del quanto, quindi f è piccolo e la priorità alta.`],
['tf', R`Round Robin deve conoscere la durata dei processi.`, false, R`SJF, SRTN sì; RR e FCFS no.`],
['tf', R`Il modello 1 − pⁿ è esatto.`, false, R`È approssimato: considera i processi indipendenti.`],

['fill', R`Media esponenziale: τₙ₊₁ = [[α]] · tₙ + (1 − α) · [[τₙ]]`, [R`tₙ₊₁`, R`n`], R`tₙ = durata vera dell'ultimo burst, τₙ = la stima che avevi fatto.`],

<script>
(function(){
"use strict";
const EXAM = new Date(2026, 10, 3);
const KEY = 'so-tascabile.v1';
const DAY = 864e5;
const INTERVALS = [0, 10*60e3, 6*3600e3, DAY, 2*DAY, 4*DAY];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
function hash(s){ let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }

/* ---------- items ---------- */
const ITEMS = [];
const BYMOD = {};
const KINDNAME = {fc:'Flashcard', mc:'Crocetta', tf:'Vero o falso', fill:'Completa', code:'Codice da completare', ord:'Metti in ordine', num:'Calcola'};
MODULES.forEach((m, mi) => {
  m.n = mi + 1; BYMOD[m.id] = [];
  m.items.forEach(raw => {
    const k = raw[0]; let it = { k, mod: m.id };
    if (k === 'fc') { it.q = raw[1]; it.a = raw[2]; }
    else if (k === 'mc') { it.q = raw[1]; it.opts = raw[2]; it.why = raw[3]; }
    else if (k === 'tf') { it.q = raw[1]; it.ans = raw[2]; it.why = raw[3]; }
    else if (k === 'fill') { it.text = raw[1]; it.q = raw[1]; it.dis = raw[2]; it.why = raw[3]; }
    else if (k === 'code') { it.q = raw[1]; it.text = raw[2]; it.dis = raw[3]; it.why = raw[4]; }
    else if (k === 'ord') { it.q = raw[1]; it.steps = raw[2]; it.why = raw[3]; }
    else if (k === 'num') { it.q = raw[1]; it.ans = raw[2]; it.why = raw[3]; it.tol = raw[4] || 0.001; }
    it.id = m.id + '.' + k + '.' + hash((it.q || '') + '|' + (it.text || ''));
    ITEMS.push(it); BYMOD[m.id].push(it);
  });
});
const MOD = Object.fromEntries(MODULES.map(m => [m.id, m]));

/* ---------- state ---------- */
let S = { items:{}, days:{}, goal:100, sound:true, updated:0 };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
function saveLocal(){ S.updated = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
const st = id => S.items[id];
const totalXP = () => Object.values(S.days).reduce((a, b) => a + b, 0);
function addXP(n){ const d = today(); S.days[d] = (S.days[d] || 0) + n; }
function streak(){
  let n = 0; const d = new Date();
  const key = x => x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0');
  if (!S.days[key(d)]) d.setDate(d.getDate() - 1);
  while (S.days[key(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function record(it, ok){
  const now = Date.now(); const r = S.items[it.id] || { b:0, d:0, s:0, w:0, l:0 };
  r.s++; r.l = now;
  if (ok) { r.b = Math.min(r.b + 1, 5); r.d = now + INTERVALS[r.b]; }
  else { r.b = 0; r.d = now; r.w++; }
  S.items[it.id] = r;
}
function mastery(list){ if (!list.length) return 0; let s = 0; list.forEach(it => { const r = st(it.id); s += r ? Math.min(r.b, 4) : 0; }); return Math.round(100 * s / (4 * list.length)); }

/* remote sync (per-viewer, private) */
let remote = null, saving = Promise.resolve();
function merge(a, b){
  const out = Object.assign({}, a, { items: Object.assign({}, a.items), days: Object.assign({}, a.days) });
  for (const [id, r] of Object.entries(b.items || {})) { const x = out.items[id]; if (!x || (r.l || 0) > (x.l || 0)) out.items[id] = r; }
  for (const [d, v] of Object.entries(b.days || {})) out.days[d] = Math.max(out.days[d] || 0, v);
  if ((b.updated || 0) > (a.updated || 0)) { out.goal = b.goal || out.goal; out.sound = b.sound !== undefined ? b.sound : out.sound; }
  out.updated = Math.max(a.updated || 0, b.updated || 0);
  return out;
}
function saveRemote(){
  if (!remote) return;
  const snap = JSON.parse(JSON.stringify(S));
  saving = saving.then(() => remote.set(snap)).then(() => setSync('Progressi salvati anche nel tuo account')).catch(() => setSync('Progressi salvati su questo dispositivo'));
}
function setSync(t){ const el = $('#syncNote'); if (el) el.textContent = t; }
(async function connect(){
  try {
    if (!window.claude || !window.claude.use) return;
    const [user, db] = await Promise.all([window.claude.use('user'), window.claude.use('db')]);
    if (!user || !db) return;
    const id = await user.id(); if (!id) return;
    remote = db.doc('data/users/' + id + '/progress');
    const snap = await remote.get();
    if (snap.exists) { S = merge(S, snap.data()); saveLocal(); if (!$('#home').hidden) renderHome(); }
    saveRemote();
  } catch(e) { remote = null; }
})();

/* ---------- sound + haptics ---------- */
let actx = null;
function tone(ok){
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = ok ? [660, 990] : [220, 180]; let t = actx.currentTime;
    notes.forEach((f, i) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = ok ? 'sine' : 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t + i*0.09); g.gain.exponentialRampToValueAtTime(0.18, t + i*0.09 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + i*0.09 + 0.16); o.connect(g).connect(actx.destination); o.start(t + i*0.09); o.stop(t + i*0.09 + 0.2); });
  } catch(e) {}
  try { navigator.vibrate && navigator.vibrate(ok ? 12 : [30, 40, 30]); } catch(e) {}
}
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('on'), 1800); }

/* ---------- selection ---------- */
function pick(pool, k, opt = {}){
  const now = Date.now(); const due = [], fresh = [], later = [];
  shuffle(pool).forEach(it => { const r = st(it.id); if (!r) fresh.push(it); else if (r.d <= now) due.push(it); else later.push(it); });
  due.sort((a, b) => st(a.id).b - st(b.id).b);
  later.sort((a, b) => st(a.id).d - st(b.id).d);
  const out = []; const maxFc = opt.maxFc ?? 1; let fc = 0;
  const take = (arr, lim) => { for (const it of arr) { if (out.length >= lim) break; if (out.includes(it)) continue; if (it.k === 'fc' && fc >= maxFc) continue; if (it.k === 'fc') fc++; out.push(it); } };
  take(due, Math.ceil(k * 0.6)); take(fresh, k); take(due, k); take(later, k);
  return shuffle(out);
}
const errorPool = () => ITEMS.filter(it => { const r = st(it.id); return r && r.w > 0 && r.b < 3; });

/* ---------- lesson engine ---------- */
let L = null;
function startLesson(items, opt){
  if (!items.length) { toast('Niente da fare qui per ora'); return; }
  L = { queue: items.map(it => ({ it, retry: false })), base: items.length, done: 0, pos: 0, correct: 0, first: 0, xp: 0, combo: 0, best: 0, wrong: [], t0: Date.now(), opt };
  show('lesson'); next();
}
$('#quitBtn').onclick = () => { if (L && L.xp) { saveLocal(); saveRemote(); } L = null; renderHome(); show('home'); };

function setProg(){ $('#progBar').style.width = (100 * L.done / L.base) + '%'; $('#combo').textContent = L.combo >= 3 ? L.combo + '× di fila' : ''; }

function next(){
  setProg(); hideFb();
  if (L.pos >= L.queue.length) return finish();
  const cur = L.queue[L.pos]; const it = cur.it;
  const qa = $('#qArea'), fa = $('#footArea');
  qa.innerHTML = '<div class="kind"><span class="label">' + (cur.retry ? 'Riprova · ' : '') + KINDNAME[it.k] + '</span><span class="modtag">' + esc(MOD[it.mod].title) + '</span></div>';
  fa.innerHTML = '';
  const ui = RENDER[it.k](it, qa);
  L.ui = ui;
  if (it.k === 'fc') {
    fa.innerHTML = '<button class="btn" id="revealBtn">Mostra la risposta</button>';
    $('#revealBtn').onclick = () => { ui.reveal(); fa.innerHTML = '<div class="two"><button class="btn bad" id="noBtn">Non la sapevo</button><button class="btn ok" id="yesBtn">La sapevo</button></div>'; $('#noBtn').onclick = () => grade(false); $('#yesBtn').onclick = () => grade(true); };
  } else {
    fa.innerHTML = '<button class="btn" id="checkBtn" disabled>Verifica</button>';
    $('#checkBtn').onclick = () => { if (ui.ready()) grade(ui.check()); };
    ui.onChange = () => { $('#checkBtn').disabled = !ui.ready(); };
  }
  $('.lbody').scrollTop = 0;
}

function grade(ok){
  const cur = L.queue[L.pos]; const it = cur.it;
  record(it, ok); tone(ok);
  if (ok) {
    L.combo++; L.best = Math.max(L.best, L.combo); L.correct++;
    if (!cur.retry) L.first++;
    let g = it.k === 'fc' ? 5 : cur.retry ? 5 : 10; if (L.combo > 0 && L.combo % 5 === 0) g += 5;
    L.xp += g; addXP(g); L.done++;
  } else {
    L.combo = 0;
    if (!L.wrong.includes(it)) L.wrong.push(it);
    if (!cur.retry && !L.opt.exam) L.queue.push({ it, retry: true }); else L.done++;
  }
  saveLocal(); setProg();
  if (it.k === 'fc') { L.pos++; return next(); }
  showFb(ok, it);
}

const PRAISE = ['Giusto!', 'Perfetto!', 'Esatto!', 'Ottimo!', 'Bravo!', 'Proprio così!'];
function showFb(ok, it){
  const fb = $('#fb'); fb.className = 'fb ' + (ok ? 'good' : 'bad');
  $('#fbTitle').innerHTML = ok ? PRAISE[Math.floor(Math.random() * PRAISE.length)] : 'Non proprio';
  const sol = ok ? '' : solution(it);
  $('#fbSol').textContent = sol ? 'Risposta: ' + sol : '';
  $('#fbSol').className = 'sol' + (it.k === 'code' ? ' mono' : '');
  $('#fbWhy').innerHTML = it.why ? md(it.why) : '';
  $('#fbBtn').className = 'btn ' + (ok ? 'ok' : 'bad');
  requestAnimationFrame(() => fb.classList.add('on'));
  $('#fbBtn').focus({ preventScroll: true });
}
function hideFb(){ $('#fb').classList.remove('on'); }
$('#fbBtn').onclick = () => { L.pos++; next(); };

function solution(it){
  if (it.k === 'mc') return it.opts[0];
  if (it.k === 'tf') return it.ans ? 'Vero' : 'Falso';
  if (it.k === 'fill' || it.k === 'code') return blanks(it.text).join('  ·  ');
  if (it.k === 'ord') return it.steps.map((s, i) => (i + 1) + '. ' + s).join('\n');
  if (it.k === 'num') return String(it.ans).replace('.', ',');
  return '';
}
const BL = /\[\[(.+?)\]\](?!\])/g;
const blanks = t => [...t.matchAll(BL)].map(m => m[1]);

/* renderers */
const RENDER = {
  fc(it, el){
    el.insertAdjacentHTML('beforeend', '<div class="card"><div class="front">' + md(it.q) + '</div><div class="back" id="fcBack" hidden>' + md(it.a) + '</div></div><p class="muted" style="font-size:14px;margin-top:14px">Rispondi a voce, poi controlla.</p>');
    return { reveal(){ $('#fcBack').hidden = false; } };
  },
  mc(it, el){
    const opts = shuffle(it.opts.map((t, i) => ({ t, ok: i === 0 })));
    el.insertAdjacentHTML('beforeend', '<p class="q' + (it.q.length > 110 ? ' small' : '') + '">' + md(it.q) + '</p><div class="opts">' + opts.map((o, i) => '<button class="opt" data-i="' + i + '" aria-pressed="false"><span class="k">' + 'ABCD'[i] + '</span><span>' + esc(o.t) + '</span></button>').join('') + '</div>');
    let sel = -1; const ui = { ready: () => sel >= 0, check(){ const bs = el.querySelectorAll('.opt'); bs.forEach((b, i) => { b.disabled = true; if (opts[i].ok) b.classList.add('right'); else if (i === sel) b.classList.add('wrong'); }); return opts[sel].ok; } };
    el.querySelector('.opts').onclick = e => { const b = e.target.closest('.opt'); if (!b || b.disabled) return; sel = +b.dataset.i; el.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-pressed', x === b)); ui.onChange && ui.onChange(); };
    return ui;
  },
  tf(it, el){
    el.insertAdjacentHTML('beforeend', '<p class="q">' + md(it.q) + '</p><div class="tfrow"><button class="opt" data-v="1" aria-pressed="false">Vero</button><button class="opt" data-v="0" aria-pressed="false">Falso</button></div>');
    let sel = null; const ui = { ready: () => sel !== null, check(){ el.querySelectorAll('.opt').forEach(b => { b.disabled = true; const v = b.dataset.v === '1'; if (v === it.ans) b.classList.add('right'); else if (v === sel) b.classList.add('wrong'); }); return sel === it.ans; } };
    el.querySelector('.tfrow').onclick = e => { const b = e.target.closest('.opt'); if (!b || b.disabled) return; sel = b.dataset.v === '1'; el.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-pressed', x === b)); ui.onChange && ui.onChange(); };
    return ui;
  },
  fill(it, el){ return blankUI(it, el, false); },
  code(it, el){ return blankUI(it, el, true); },
  ord(it, el){
    const pool = shuffle(it.steps.map((t, i) => ({ t, i })));
    el.insertAdjacentHTML('beforeend', '<p class="q small">' + md(it.q) + '</p><div class="ordans" id="oAns"></div><div class="ordpool" id="oPool">' + pool.map((s, k) => '<button class="ordit" data-k="' + k + '"><span>' + esc(s.t) + '</span></button>').join('') + '</div>');
    const ans = []; const A = el.querySelector('#oAns'), P = el.querySelector('#oPool');
    const draw = () => { A.innerHTML = ans.map((k, j) => '<button class="ordit" data-k="' + k + '"><span class="n">' + (j + 1) + '</span><span>' + esc(pool[k].t) + '</span></button>').join(''); P.querySelectorAll('.ordit').forEach(b => b.classList.toggle('used', ans.includes(+b.dataset.k))); ui.onChange && ui.onChange(); };
    const ui = { ready: () => ans.length === pool.length, check(){ let ok = true; A.querySelectorAll('.ordit').forEach((b, j) => { const good = pool[+b.dataset.k].i === j; b.classList.add(good ? 'right' : 'wrong'); b.disabled = true; if (!good) ok = false; }); return ok; } };
    P.onclick = e => { const b = e.target.closest('.ordit'); if (!b || b.disabled) return; ans.push(+b.dataset.k); draw(); };
    A.onclick = e => { const b = e.target.closest('.ordit'); if (!b || b.disabled) return; ans.splice(ans.indexOf(+b.dataset.k), 1); draw(); };
    return ui;
  },
  num(it, el){
    const nl = it.q.indexOf('\n');
    const head = nl > 0 ? it.q.slice(0, nl) : it.q, code = nl > 0 ? it.q.slice(nl + 1) : '';
    el.insertAdjacentHTML('beforeend', '<p class="q' + (head.length > 110 ? ' small' : '') + '">' + md(head) + '</p>' + (code ? '<pre class="code">' + esc(code) + '</pre>' : '') + '<div class="numin"><input id="numIn" type="text" inputmode="decimal" autocomplete="off" placeholder="?" aria-label="Risposta"></div>');
    const inp = el.querySelector('#numIn');
    const val = () => parseFloat(inp.value.replace(',', '.').replace('−', '-').trim());
    const ui = { ready: () => !isNaN(val()), check(){ inp.disabled = true; const ok = Math.abs(val() - it.ans) <= it.tol; inp.style.borderColor = ok ? 'var(--ok)' : 'var(--bad)'; return ok; } };
    inp.oninput = () => ui.onChange && ui.onChange();
    inp.onkeydown = e => { if (e.key === 'Enter' && ui.ready()) { e.preventDefault(); inp.blur(); grade(ui.check()); } };
    return ui;
  }
};

function blankUI(it, el, isCode){
  const ans = blanks(it.text);
  const dis = (it.dis || []).filter(d => !ans.includes(d));
  const chips = shuffle(ans.concat(dis)).map((t, i) => ({ t, i }));
  let html = ''; let last = 0, bi = 0;
  for (const m of it.text.matchAll(BL)) {
    html += esc(it.text.slice(last, m.index));
    html += '<button class="slot" data-b="' + bi + '" style="min-width:' + (Math.max(3, m[1].length) + 1) + 'ch">&nbsp;</button>';
    last = m.index + m[0].length; bi++;
  }
  html += esc(it.text.slice(last));
  el.insertAdjacentHTML('beforeend', (isCode ? '<p class="q small">' + md(it.q) + '</p><pre class="code">' + html + '</pre>' : '<p class="fillq">' + html.replace(/\n/g, '<br>') + '</p>') +
    '<div class="bank">' + chips.map(c => '<button class="chip' + (isCode ? ' mono' : '') + '" data-c="' + c.i + '">' + esc(c.t) + '</button>').join('') + '</div>');
  const fill = new Array(ans.length).fill(null);
  const slots = el.querySelectorAll('.slot'), chipEls = el.querySelectorAll('.chip');
  const draw = () => {
    slots.forEach((s, i) => { const c = fill[i]; s.textContent = c === null ? ' ' : chips.find(x => x.i === c).t; s.classList.toggle('filled', c !== null); });
    chipEls.forEach(ch => ch.classList.toggle('used', fill.includes(+ch.dataset.c)));
    ui.onChange && ui.onChange();
  };
  const ui = { ready: () => fill.every(x => x !== null), check(){
    let ok = true;
    slots.forEach((s, i) => { s.disabled = true; const good = chips.find(x => x.i === fill[i]).t === ans[i]; s.classList.remove('filled'); s.classList.add(good ? 'right' : 'wrong'); if (!good) ok = false; });
    chipEls.forEach(c => c.disabled = true); return ok; } };
  el.querySelector('.bank').onclick = e => { const ch = e.target.closest('.chip'); if (!ch || ch.disabled) return; const k = fill.indexOf(null); if (k < 0) return; fill[k] = +ch.dataset.c; draw(); };
  slots.forEach(s => s.onclick = () => { if (s.disabled) return; fill[+s.dataset.b] = null; draw(); });
  return ui;
}

function finish(){
  const secs = Math.round((Date.now() - L.t0) / 1000);
  const acc = Math.round(100 * L.first / L.base);
  saveLocal(); saveRemote();
  const exam = L.opt.exam;
  const head = exam ? (L.first + '/' + L.base) : '+' + L.xp;
  const title = exam ? (acc >= 80 ? 'Pronto per lo scritto' : acc >= 60 ? 'Ci sei quasi' : 'Ancora un giro') : acc >= 90 ? 'Lezione perfetta' : acc >= 60 ? 'Lezione completata' : 'Fatto, gli errori tornano dopo';
  const rev = L.wrong.length ? '<div class="review"><div class="label">Da rivedere</div><ul>' + L.wrong.slice(0, 8).map(it => '<li><b>' + esc(trim(it.q)) + '</b><br><span class="muted">' + esc(trim(solution(it), 140)) + '</span></li>').join('') + '</ul></div>' : '';
  $('#resArea').innerHTML = '<div class="burst">' + head + '</div><div class="big">' + title + '</div><div class="muted">' + esc(L.opt.title) + (exam ? ' · risposte giuste al primo colpo' : ' · XP guadagnati') + '</div>' +
    '<div class="stats3"><div class="stat"><b>' + acc + '%</b><span>precisione</span></div><div class="stat"><b>' + fmtT(secs) + '</b><span>tempo</span></div><div class="stat"><b>' + L.best + '</b><span>serie migliore</span></div></div>' + rev +
    '<div class="stack"><button class="btn" id="resHome">Continua</button>' + (L.wrong.length ? '<button class="btn ghost" id="resAgain">Rifai subito gli errori</button>' : '') + '</div>';
  const wrong = L.wrong.slice(); L = null;
  $('#resHome').onclick = () => { renderHome(); show('home'); };
  const ra = $('#resAgain'); if (ra) ra.onclick = () => startLesson(shuffle(wrong), { title: 'Errori di questa lezione' });
  show('result');
}
const trim = (s, n = 90) => { s = String(s).replace(/\*\*/g, '').replace(/\s+/g, ' '); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const fmtT = s => s < 60 ? s + 's' : Math.floor(s / 60) + 'm ' + String(s % 60).padStart(2, '0') + 's';

/* ---------- flashcards ---------- */
let C = null;
function startCards(list, title){
  if (!list.length) { toast('Nessuna flashcard qui'); return; }
  C = { list, i: 0, known: 0, xp: 0, title, t0: Date.now() };
  show('lesson'); hideFb(); drawCard();
}
function drawCard(){
  if (C.i >= C.list.length) return endCards();
  const it = C.list[C.i];
  $('#progBar').style.width = (100 * C.i / C.list.length) + '%'; $('#combo').textContent = (C.i + 1) + '/' + C.list.length;
  $('#qArea').innerHTML = '<div class="kind"><span class="label">Flashcard</span><span class="modtag">' + esc(MOD[it.mod].title) + '</span></div><div class="deck"><div class="fcard" id="fcard" role="button" tabindex="0" aria-label="Gira la carta">' +
    '<div class="face"><span class="mt">Domanda</span><div class="ft">' + md(it.q) + '</div><div class="hint">Tocca per girare</div></div>' +
    '<div class="face b"><span class="mt">Risposta</span><div class="bt">' + md(it.a) + '</div></div></div></div>';
  const card = $('#fcard'); let flipped = false;
  const flip = () => { flipped = !flipped; card.classList.toggle('flip', flipped); if (flipped) btns(); };
  card.onclick = flip; card.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } };
  // altezza: adatta alla faccia più lunga
  requestAnimationFrame(() => { const h = Math.max(...[...card.querySelectorAll('.face')].map(f => f.scrollHeight)); card.style.minHeight = Math.max(340, h) + 'px'; });
  let sx = null; card.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  card.addEventListener('touchend', e => { if (sx === null || !flipped) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 70) cardGrade(dx > 0); });
  $('#footArea').innerHTML = '<button class="btn ghost" id="flipBtn">Gira la carta</button>';
  $('#flipBtn').onclick = flip;
  function btns(){ $('#footArea').innerHTML = '<div class="two"><button class="btn bad" id="cNo">Da ripassare</button><button class="btn ok" id="cYes">La so</button></div>'; $('#cNo').onclick = () => cardGrade(false); $('#cYes').onclick = () => cardGrade(true); }
}
function cardGrade(ok){ const it = C.list[C.i]; record(it, ok); if (ok) { C.known++; C.xp += 5; addXP(5); } saveLocal(); try { navigator.vibrate && navigator.vibrate(8); } catch(e) {} C.i++; drawCard(); }
function endCards(){
  saveLocal(); saveRemote();
  const n = C.list.length, k = C.known, secs = Math.round((Date.now() - C.t0) / 1000);
  $('#resArea').innerHTML = '<div class="burst">' + k + '/' + n + '</div><div class="big">' + (k === n ? 'Le sai tutte' : 'Mazzo finito') + '</div><div class="muted">' + esc(C.title) + ' · carte che sapevi</div>' +
    '<div class="stats3"><div class="stat"><b>+' + C.xp + '</b><span>XP</span></div><div class="stat"><b>' + fmtT(secs) + '</b><span>tempo</span></div><div class="stat"><b>' + (n - k) + '</b><span>da ripassare</span></div></div>' +
    '<div class="stack"><button class="btn" id="resHome">Continua</button></div>';
  C = null; $('#resHome').onclick = () => { renderHome(); show('home'); };
  show('result');
}
const quit0 = $('#quitBtn').onclick;
$('#quitBtn').onclick = () => { if (C) { saveLocal(); saveRemote(); C = null; renderHome(); show('home'); return; } quit0(); };

renderHome(); show('home');
})();
</script>

</body>
</html>
